[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "world-cup-intel"
version = "0.1.0"
description = "World Cup national-team intelligence system"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10,<4",
  "httpx>=0.27,<0.28",
  "sqlalchemy>=2.0,<2.1",
  "typer>=0.12,<0.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
